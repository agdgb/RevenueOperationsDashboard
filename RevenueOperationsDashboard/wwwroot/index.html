<!DOCTYPE html>
<html lang="am" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Service Performance Operations Center</title>

  <!-- Tailwind CSS -->
  <script src="./tailwindcss.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0b1120',
            cardBg: '#1e293b',
            borderDark: '#334155',
            accentGreen: '#10b981',
            accentBlue: '#3b82f6',
            accentCyan: '#06b6d4',
            accentRed: '#ef4444',
            accentOrange: '#f59e0b',
            accentPurple: '#8b5cf6'
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="./css/all.min.css" />

  <!-- Apache ECharts -->
  <script src="./echarts.min.js"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }

    /* Custom TV Glow and Animations */
    .glow-dot {
      box-shadow: 0 0 12px #ef4444;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        transform: scale(0.85);
      }
    }

    main.slide-viewport {
      display: grid !important;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .slide-container {
      grid-area: 1 / 1;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.98);
      transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
      pointer-events: none;
      display: flex !important;
    }

    .slide-visible {
      opacity: 1 !important;
      visibility: visible !important;
      transform: scale(1) !important;
      pointer-events: auto !important;
    }

    .slide-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      transform: scale(0.98) !important;
      pointer-events: none !important;
    }

    /* Scrollbar customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>

<body class="h-screen w-screen overflow-hidden p-4 relative flex flex-col bg-brandDark text-slate-100">

  <!-- FLOATING NAVIGATION ARROWS (VERTICALLY CENTERED & HORIZONTALLY SPACED) -->
  <button onclick="prevSlide()"
    class="fixed left-6 top-1/2 -translate-y-1/2 z-50 p-4 rounded-full bg-transparent text-slate-300 hover:text-white border border-white/20 hover:border-cyan-500/80 hover:bg-white/10 backdrop-blur-md shadow-2xl transition-all hover:scale-110 active:scale-95 focus:outline-none group">
    <i class="fa-solid fa-chevron-left text-2xl group-hover:-translate-x-0.5 transition-transform"></i>
  </button>

  <button onclick="nextSlide()"
    class="fixed right-6 top-1/2 -translate-y-1/2 z-50 p-4 rounded-full bg-transparent text-slate-300 hover:text-white border border-white/20 hover:border-cyan-500/80 hover:bg-white/10 backdrop-blur-md shadow-2xl transition-all hover:scale-110 active:scale-95 focus:outline-none group">
    <i class="fa-solid fa-chevron-right text-2xl group-hover:translate-x-0.5 transition-transform"></i>
  </button>

  <!-- GLOBAL FILTER MODAL OVERLAY -->
  <div id="filterModal"
    class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden transition-opacity">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl p-6 shadow-2xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-sliders text-blue-400 text-xl"></i>
          <div>
            <h3 class="text-lg font-bold text-white" id="lblGlobalFilters">Global Dashboard Filters</h3>
            <p class="text-xs text-slate-400">Refine metrics across all Operations Center slides</p>
          </div>
        </div>
        <button onclick="toggleFilterModal()" class="text-slate-400 hover:text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Filter Form Elements -->
      <div class="space-y-4">
        <div>
          <label id="lblFiscalYear" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Fiscal Year</label>
          <select id="filterFiscalYear" onchange="applyFilters()"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            <!-- Loaded dynamically from API -->
          </select>
        </div>

        <div>
          <label id="lblParentBranch" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Parent Branch</label>
          <select id="filterParent" onchange="applyFilters()"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            <!-- Loaded dynamically from API -->
          </select>
        </div>

        <div>
          <label id="lblPlanTaxItem" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Plan / Tax
            Item</label>
          <select id="filterPlanItem" onchange="applyFilters()"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            <!-- Loaded dynamically from API -->
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-between border-t border-slate-800 pt-4">
        <button onclick="resetFilters()" id="lblClearFilters" class="text-xs text-slate-400 hover:text-white underline">
          Clear All Filters
        </button>
        <button onclick="toggleFilterModal()" id="lblApplyClose"
          class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2 rounded-lg transition">
          Apply & Close
        </button>
      </div>
    </div>
  </div>


  <!-- PERSISTENT TOP KPI CARDS (VISIBLE ON EVERY SLIDE) -->
  <header id="topKpiHeader" class="mb-4 flex-shrink-0 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 z-30">
    <!-- Rendered dynamically via ECharts -->
  </header>

  <!-- MAIN SLIDESHOW VIEWPORT -->
  <main class="slide-viewport flex-1 w-full h-full relative overflow-hidden flex flex-col min-h-0">

    <!-- Slide 0: Tax Type Target vs Actual -->
    <div id="slide-0" class="slide-container slide-visible h-full w-full flex-col gap-3 min-h-0">
      <div
        class="bg-cardBg border border-borderDark rounded-2xl p-4 flex flex-col h-full w-full shadow-xl min-h-0 overflow-hidden">
        <div id="chartTaxType" class="w-full flex-1 min-h-[300px]"></div>
      </div>
    </div>

    <!-- Slide 1: Monthly Achievement Trend % Curve -->
    <div id="slide-1" class="slide-container slide-hidden h-full w-full flex-col gap-3 min-h-0">
      <div
        class="bg-cardBg border border-borderDark rounded-2xl p-4 flex flex-col h-full w-full shadow-xl min-h-0 overflow-hidden">
        <div id="chartMonthlyTrend" class="w-full flex-1 min-h-[300px]"></div>
      </div>
    </div>

    <!-- Slide 2: Branch Achievement % by Office -->
    <div id="slide-2" class="slide-container slide-hidden h-full w-full flex-col gap-3 min-h-0">
      <div
        class="bg-cardBg border border-borderDark rounded-2xl p-4 flex flex-col h-full w-full shadow-xl min-h-0 overflow-hidden">
        <div id="chartBranchVolume" class="w-full flex-1 min-h-[300px]"></div>
      </div>
    </div>

  </main>

  <!-- DYNAMIC PREMIUM FOOTER TOOLBAR (HOVER TO SHOW) -->
  <div class="fixed bottom-0 left-0 right-0 z-50 px-4 pb-4 md:px-6 md:pb-6 group flex justify-center">
    <!-- Invisible trigger area at the bottom edge -->
    <div class="absolute bottom-0 left-0 w-full h-12 cursor-pointer z-0"></div>
    <footer
      class="w-full relative z-10 flex-shrink-0 bg-slate-900/60 border border-slate-800/80 backdrop-blur-md rounded-xl p-3 flex items-center justify-between transition-all duration-300 transform translate-y-[150%] opacity-0 group-hover:translate-y-0 group-hover:opacity-100 shadow-2xl">
      <div class="flex items-center gap-4">
      <button id="playPauseBtn" onclick="toggleCarousel()"
        class="flex items-center gap-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
        <i id="playPauseIcon" class="fa-solid fa-pause"></i>
        <span id="playPauseText">Pause</span>
      </button>
      <div class="w-32 bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div id="carouselProgressBar" class="bg-blue-500 h-full w-0 transition-all duration-100"></div>
      </div>
      <span id="slideTitleDisplay" class="text-xs font-medium text-slate-400">Slide 1 of 3: Tax Type Target vs
        Actual</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Dot Indicators -->
      <div id="carouselDots" class="flex items-center gap-1.5 mr-4"></div>

      <!-- Action Buttons -->
      <select id="themeSelector" onchange="changeTheme(this.value)" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs px-2 py-2 rounded-lg border border-slate-700/50 transition focus:outline-none cursor-pointer">
        <option value="ocean">Ocean (Default)</option>
        <option value="national">National (Green/Yellow/Red)</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="grayscale">Grayscale</option>
      </select>

      <button onclick="toggleLanguage()" id="langToggleBtn"
        class="flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-white font-bold text-xs w-9 h-9 rounded-lg border border-slate-700/50 transition shadow-lg">
        EN
      </button>

      <button onclick="toggleFilterModal()"
        class="flex items-center gap-2 bg-blue-600/80 hover:bg-blue-600 text-white font-semibold text-xs px-4 py-2 rounded-lg border border-blue-500/30 transition shadow-lg">
        <i class="fa-solid fa-sliders"></i> <span id="lblFiltersBtn">Filters</span>
      </button>

      <button onclick="toggleFullscreen()" class="text-slate-400 hover:text-white transition p-1">
        <i class="fa-solid fa-expand text-sm"></i>
      </button>
    </div>
  </footer>
  </div>

  <!-- JASS SCRIPT LOGIC & DYNAMIC INTEGRATION -->
  <script>
    // Global Application State
    const state = {
      currentLang: 'en', // 'en' or 'am'
      currentTheme: 'ocean',
      currentSlide: 0,
      slideCount: 0,
      activeSlides: [],
      autoRotate: true,
      slideDuration: 12000, // 12 seconds per slide
      timerProgress: 0,
      timerInterval: null,
      filters: {
        fiscalYear: 'ALL',
        parent: 'ALL',
        planItem: 'ALL'
      }
    };

    // ECharts Instances Map
    const chartInstances = {};

    // Theme Engine Registry
    const appThemes = {
      ocean: {
        bg: '#0b1120', cardBg: 'rgba(30, 41, 59, 0.95)', border: '#334155',
        primary: '#06b6d4', secondary: '#3b82f6',
        success: '#10b981', warning: '#f59e0b', danger: '#ef4444'
      },
      national: {
        bg: '#020617', cardBg: 'rgba(15, 23, 42, 0.95)', border: '#1e293b',
        primary: '#10b981', secondary: '#f59e0b',
        success: '#10b981', warning: '#f59e0b', danger: '#ef4444'
      },
      forest: {
        bg: '#022c22', cardBg: 'rgba(6, 78, 59, 0.95)', border: '#065f46',
        primary: '#34d399', secondary: '#10b981',
        success: '#10b981', warning: '#fbbf24', danger: '#ef4444'
      },
      sunset: {
        bg: '#2e1022', cardBg: 'rgba(74, 23, 54, 0.95)', border: '#701a4f',
        primary: '#f97316', secondary: '#ef4444',
        success: '#10b981', warning: '#f59e0b', danger: '#ef4444'
      },
      grayscale: {
        bg: '#111827', cardBg: 'rgba(31, 41, 55, 0.95)', border: '#374151',
        primary: '#9ca3af', secondary: '#4b5563',
        success: '#6b7280', warning: '#9ca3af', danger: '#d1d5db'
      }
    };

    // Translations
    const db_am_to_en = {
      "ምንዳና ደመወዝ(1101)": "Employment Tax (1101)",
      "ንግድ ትረፍ(1103)": "Business Profit (1103)",
      "የተጨማሪ እሴት ታክስ ድምር(1120-1199)": "Value Added Tax (1120)",
      "የኪራይ ገቢ(1102)": "Rental Income (1102)",
      "የማዘጋጃ ቤቶች ገቢ(1700-1799)": "Municipal Revenue (1700)",
      "ቤት ግብር(1701)": "Property Tax (1701)",
      "ሐምሌ": "Jul", "ሀምሌ": "Jul",
      "ነሐሴ": "Aug", "ነሀሴ": "Aug",
      "መስከረም": "Sep",
      "ጥቅምት": "Oct",
      "ኅዳር": "Nov", "ህዳር": "Nov",
      "ታኅሣሥ": "Dec", "ታህሳስ": "Dec",
      "ጥር": "Jan",
      "የካቲት": "Feb",
      "መጋቢት": "Mar",
      "ሚያዝያ": "Apr", "ሚያዚያ": "Apr",
      "ግንቦት": "May",
      "ሰኔ": "Jun",
      "አዲስ አበባ ከተማ አስተዳደር ገቢዎች ቢሮ": "Addis Ababa City Admin Revenue Bureau",
      "ትላልቅ ግብር ከፋዮች ቅ/ጽ/ቤት": "Large Taxpayers Branch Office",
      "መካከለኛ ግብር ከፋዮች ቅ/ጽ/ቤት": "Medium Taxpayers Branch Office",
      "አዲስ አበባ አነስተኛ ግብር ከፋዮች ቅ/ጽ/ቤት": "Addis Ababa Small Taxpayers Branch",
      "ምስራቅ አዲስ አበባ አነስተኛ ግ/ከ/ቅ/ጽ/ቤት": "East AA Small Taxpayers Branch",
      "ምዕራብ አዲስ አበባ አነስተኛ ግ/ከ/ቅ/ጽ/ቤት": "West AA Small Taxpayers Branch",
      "አዳማ ቅ/ጽ/ቤት": "Adama Branch Office",
      "ድሬዳዋ ቅ/ጽ/ቤት": "Dire Dawa Branch Office",
      "ባህርዳር ቅ/ጽ/ቤት": "Bahir Dar Branch Office",
      "መቀሌ ቅ/ጽ/ቤት": "Mekelle Branch Office",
      "ጂማ ቅ/ጽ/ቤት": "Jimma Branch Office",
      "ደሴ ቅ/ጽ/ቤት": "Dessie Branch Office",
      "ሀዋሳ ቅ/ጽ/ቤት": "Hawassa Branch Office"
    };

    const ui_en_to_am = {
      "Global Dashboard Filters": "የዳሽቦርድ ማጣሪያዎች",
      "Fiscal Year": "በጀት ዓመት",
      "Parent Branch": "ዋና ቅርንጫፍ",
      "Plan / Tax Item": "የእቅድ / የታክስ አይነት",
      "Clear All Filters": "ማጣሪያዎችን አጽዳ",
      "Apply & Close": "ተግብር እና ዝጋ",
      "All Branches": "ሁሉም ቅርንጫፎች",
      "All Tax Types": "ሁሉም የታክስ አይነቶች",
      "Filters": "መለያ",
      "Slide": "ገጽ",
      "of": "ከ",
      "Plan": "እቅድ",
      "Actual": "ክንውን",
      "Act": "ክንውን",
      "Target": "እቅድ",
      "Performance": "አፈፃፀም",
      "Pause": "አቁም",
      "Resume": "ቀጥል"
    };

    function t_db(text) {
      if (!text) return text;
      // Database values are Amharic. If currentLang is 'en', we translate to English.
      if (state.currentLang === 'en') {
        // Strip trailing spaces and try to match
        const cleanText = text.toString().trim();
        return db_am_to_en[cleanText] || text;
      }
      return text;
    }

    function t_ui(text) {
      if (!text) return text;
      if (state.currentLang === 'am') {
        return ui_en_to_am[text] || text;
      }
      return text;
    }

    function toggleLanguage() {
      state.currentLang = state.currentLang === 'en' ? 'am' : 'en';
      document.getElementById('langToggleBtn').innerText = state.currentLang === 'en' ? 'EN' : 'አማ';
      updateUILanguage();
      
      // Refresh UI components that use language
      loadFilterDropdowns(); // Re-render dropdowns to apply language
      applyFilters(); // Re-fetch or re-render charts and cards
    }

    function changeTheme(themeKey) {
      if (!appThemes[themeKey]) return;
      state.currentTheme = themeKey;
      const theme = appThemes[themeKey];

      // Update Global CSS Variables / Body
      document.body.style.backgroundColor = theme.bg;
      
      // We manually update card backgrounds that are using tailwind classes
      const cards = document.querySelectorAll('.bg-cardBg, .bg-slate-900\\/95, .bg-slate-900\\/60');
      cards.forEach(card => {
        // Just setting background and border explicitly
        card.style.backgroundColor = theme.cardBg;
        card.style.borderColor = theme.border;
      });

      // Update footer
      const footer = document.querySelector('footer');
      if (footer) {
        footer.style.backgroundColor = theme.bg;
        footer.style.borderColor = theme.border;
      }

      // Trigger a re-render of charts and top cards
      loadTopCards();
      refreshActiveSlideMetric(state.currentSlide);
    }

    function updateUILanguage() {
      if(document.getElementById('lblGlobalFilters')) document.getElementById('lblGlobalFilters').innerText = t_ui("Global Dashboard Filters");
      if(document.getElementById('lblFiscalYear')) document.getElementById('lblFiscalYear').innerText = t_ui("Fiscal Year");
      if(document.getElementById('lblParentBranch')) document.getElementById('lblParentBranch').innerText = t_ui("Parent Branch");
      if(document.getElementById('lblPlanTaxItem')) document.getElementById('lblPlanTaxItem').innerText = t_ui("Plan / Tax Item");
      if(document.getElementById('lblClearFilters')) document.getElementById('lblClearFilters').innerText = t_ui("Clear All Filters");
      if(document.getElementById('lblApplyClose')) document.getElementById('lblApplyClose').innerText = t_ui("Apply & Close");
      if(document.getElementById('lblFiltersBtn')) document.getElementById('lblFiltersBtn').innerText = t_ui("Filters");
      updatePlayPauseButtonState();
      
      // Update Slide Titles
      if(state.config && state.config.carousel && state.config.carousel.slides) {
        state.config.carousel.slides.forEach(slideConfig => {
          const slideEl = document.getElementById(slideConfig.id);
          if(slideEl) {
            const titleEl = slideEl.querySelector('h2');
            const subEl = slideEl.querySelector('p');
            if (titleEl) titleEl.innerText = state.currentLang === 'am' && slideConfig.titleAm ? slideConfig.titleAm : slideConfig.title;
            if (subEl) subEl.innerText = state.currentLang === 'am' && slideConfig.subtitleAm ? slideConfig.subtitleAm : slideConfig.subtitle;
          }
        });
      }
      updateFooterTitle(state.currentSlide);
    }

    // Initialize Dashboard Layout and Config from Server
    async function initializeDashboardConfig() {
      try {
        const res = await fetch('/api/dashboard/config');
        const config = await res.json();
        state.config = config;

        // Apply default language
        if (config.defaultLanguage) {
          state.currentLang = config.defaultLanguage;
          document.getElementById('langToggleBtn').innerText = state.currentLang === 'en' ? 'EN' : 'አማ';
          updateUILanguage();
        }

        // Set default filters
        state.filters.fiscalYear = config.defaultFilters.fiscalYearId;
        state.filters.parent = config.defaultFilters.parentId;
        state.filters.planItem = config.defaultFilters.planItemId;

        state.autoRotate = config.carousel.autoPlay;
        state.carouselDefaultDuration = config.carousel.intervalMs || 12000;
        state.slideDuration = state.carouselDefaultDuration;
        updatePlayPauseButtonState();

        const mainViewport = document.querySelector('main');
        const visibleSlides = [];

        // Track and process slides based on config
        for (const slideConfig of config.carousel.slides) {
          const slideEl = document.getElementById(slideConfig.id);
          if (!slideEl) continue;

          if (!slideConfig.visible) {
            slideEl.remove(); // Remove disabled slides from DOM
          } else {
            // Update Title / Subtitle if custom elements exist
            const titleEl = slideEl.querySelector('h2');
            const subEl = slideEl.querySelector('p');
            if (titleEl) titleEl.innerText = state.currentLang === 'am' && slideConfig.titleAm ? slideConfig.titleAm : slideConfig.title;
            if (subEl) subEl.innerText = state.currentLang === 'am' && slideConfig.subtitleAm ? slideConfig.subtitleAm : slideConfig.subtitle;

            // Re-append to main viewport to guarantee server-side order
            mainViewport.appendChild(slideEl);
            visibleSlides.push(slideConfig);
          }
        }

        state.activeSlides = visibleSlides;
        state.slideCount = visibleSlides.length;

        // Build Navigation Dots dynamically
        const dotsContainer = document.getElementById('carouselDots');
        if (dotsContainer) {
          dotsContainer.innerHTML = visibleSlides.map((slide, idx) => {
            const isFirst = idx === 0;
            return `<button id="dot-${idx}" onclick="goToSlide(${idx})" class="${isFirst ? 'w-6 h-2 bg-blue-500' : 'w-2 h-2 bg-slate-600 hover:bg-slate-500'} rounded-full transition-all focus:outline-none"></button>`;
          }).join('');
        }
      } catch (err) {
        console.error("Failed to load dashboard configuration:", err);
      }
    }

    // Load and Render Top KPI Cards (Persistent across slides)
    async function loadTopCards() {
      try {
        const params = new URLSearchParams({
          fiscalYearId: state.filters.fiscalYear || 'ALL',
          parentId: state.filters.parent || 'ALL',
          planItemId: state.filters.planItem || 'ALL'
        });
        const res = await fetch(`/api/dashboard/top-cards?${params}`);
        const data = await res.json();
        renderTopKpiCards(data.cards);
      } catch (err) {
        console.error("Failed to load top KPI cards:", err);
      }
    }

    function renderTopKpiCards(cards) {
      const headerContainer = document.getElementById('topKpiHeader');
      if (!headerContainer || !cards) return;

      const theme = appThemes[state.currentTheme] || appThemes.ocean;

      headerContainer.innerHTML = cards.map(card => {
        let statusColor = theme.success;
        if (card.achievementPct < 90) statusColor = theme.warning;
        if (card.achievementPct < 70) statusColor = theme.danger;

        const badgeBg = `background-color: ${statusColor}1A; color: ${statusColor}; border-color: ${statusColor}80`;
        const cardGlow = `border-color: ${statusColor}80; box-shadow: 0 0 18px ${statusColor}38`;

        let formattedTarget = card.formattedTarget;
        if (state.currentLang === 'am') {
          formattedTarget = formattedTarget.replace('Target:', 'እቅድ:').replace('Act:', 'ክንውን:');
        }

        return `
          <div class="bg-cardBg border rounded-2xl p-4 md:p-5 flex flex-col justify-between shadow-2xl relative overflow-hidden backdrop-blur-md transition-all hover:scale-[1.03] group min-h-[120px]" style="background-color: ${theme.cardBg}; ${cardGlow}">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="min-w-0 flex-1">
                <h4 class="text-sm md:text-base font-extrabold text-slate-100 truncate" title="${state.currentLang === 'am' ? card.titleAmharic : card.titleEnglish}">${state.currentLang === 'am' ? card.titleAmharic : card.titleEnglish}</h4>
              </div>
              <span class="text-xs font-black px-2.5 py-1 rounded-lg border" style="${badgeBg}">${card.achievementPct}%</span>
            </div>
            
            <div class="flex items-center justify-between mt-2">
              <div class="min-w-0 flex-1 pr-2">
                <div class="text-xl md:text-3xl font-black text-white tracking-tight truncate">${card.formattedActual}</div>
                <div class="text-xs md:text-sm font-semibold text-slate-400 truncate mt-1">${formattedTarget}</div>
              </div>
              <div id="gauge_${card.id}" class="w-16 h-16 flex-shrink-0"></div>
            </div>
          </div>
        `;
      }).join('');

      // Initialize ECharts gauge rings after DOM insertion
      setTimeout(() => {
        cards.forEach(card => {
          const chartDom = document.getElementById(`gauge_${card.id}`);
          if (!chartDom) return;

          let myChart = chartInstances[`gauge_${card.id}`];
          if (myChart) {
            myChart.dispose(); // Destroy old instance bound to dead DOM element
          }
          myChart = echarts.init(chartDom);
          chartInstances[`gauge_${card.id}`] = myChart;

          let ringColor = theme.success;
          if (card.achievementPct < 90) ringColor = theme.warning;
          if (card.achievementPct < 70) ringColor = theme.danger;
          const option = {
            series: [{
              type: 'gauge',
              startAngle: 90,
              endAngle: -270,
              pointer: { show: false },
              progress: {
                show: true,
                overlap: false,
                roundCap: true,
                clip: false,
                itemStyle: { color: ringColor }
              },
              axisLine: {
                lineStyle: { width: 4.5, color: [[1, 'rgba(51, 65, 85, 0.4)']] }
              },
              splitLine: { show: false },
              axisTick: { show: false },
              axisLabel: { show: false },
              data: [{ value: Math.min(card.achievementPct, 100) }],
              detail: { show: false }
            }]
          };
          myChart.setOption(option);
        });
      }, 50);
    }

    // Apply Filter Changes
    async function applyFilters() {
      state.filters.fiscalYear = document.getElementById('filterFiscalYear').value;
      state.filters.parent = document.getElementById('filterParent').value;
      state.filters.planItem = document.getElementById('filterPlanItem').value;

      const filterSummaryText = document.getElementById('filterSummaryText');
      if (filterSummaryText) {
        const parentLabel = state.filters.parent === 'ALL' ? t_ui('All Branches') : document.getElementById('filterParent').options[document.getElementById('filterParent').selectedIndex].text;
        filterSummaryText.innerText = `${t_ui("Fiscal Year")}: ${state.filters.fiscalYear} | ${parentLabel}`;
      }

      await Promise.all([
        loadTopCards(),
        refreshActiveSlideMetric(state.currentSlide)
      ]);
    }

    async function resetFilters() {
      if (state.config && state.config.defaultFilters) {
        document.getElementById('filterFiscalYear').value = state.config.defaultFilters.fiscalYearId;
        document.getElementById('filterParent').value = state.config.defaultFilters.parentId;
        document.getElementById('filterPlanItem').value = state.config.defaultFilters.planItemId;
      } else {
        if (document.getElementById('filterFiscalYear').options.length > 0) {
          document.getElementById('filterFiscalYear').selectedIndex = 0;
        }
        document.getElementById('filterParent').value = 'ALL';
        document.getElementById('filterPlanItem').value = 'ALL';
      }
      await applyFilters();
    }

    // Dynamic API Fetch & Render Pipeline for Visible Slide Only
    async function refreshActiveSlideMetric(index) {
      try {
        const slide = state.activeSlides[index];
        if (!slide) return;

        const query = new URLSearchParams({
          fiscalYearId: state.filters.fiscalYear,
          parentId: state.filters.parent,
          planItemId: state.filters.planItem
        }).toString();

        const resData = await fetch(`${slide.apiEndpoint}?${query}`).then(r => r.json());

        if (slide.id === 'slide-0') {
          const taxDom = document.getElementById('chartTaxType');
          if (taxDom) {
            if (!chartInstances.taxType) {
              chartInstances.taxType = echarts.init(taxDom, 'dark');
            }
            chartInstances.taxType.resize();
            renderTaxTypeChart(resData, slide);
          }
        } else if (slide.id === 'slide-1') {
          const trendDom = document.getElementById('chartMonthlyTrend');
          if (trendDom) {
            if (!chartInstances.monthlyTrend) {
              chartInstances.monthlyTrend = echarts.init(trendDom, 'dark');
            }
            chartInstances.monthlyTrend.resize();
            renderMonthlyTrendChart(resData, slide);
          }
        } else if (slide.id === 'slide-2') {
          const branchDom = document.getElementById('chartBranchVolume');
          if (branchDom) {
            if (!chartInstances.branchVolume) {
              chartInstances.branchVolume = echarts.init(branchDom, 'dark');
            }
            chartInstances.branchVolume.resize();
            renderBranchVolumeChart(resData, slide);
          }
        } else if (slide.id === 'slide-3') {
          if (!chartInstances.topPerformers && document.getElementById('chartTopPerformers')) {
            chartInstances.topPerformers = echarts.init(document.getElementById('chartTopPerformers'), 'dark');
          }
          if (!chartInstances.bottomPerformers && document.getElementById('chartBottomPerformers')) {
            chartInstances.bottomPerformers = echarts.init(document.getElementById('chartBottomPerformers'), 'dark');
          }
          if (chartInstances.topPerformers) chartInstances.topPerformers.resize();
          if (chartInstances.bottomPerformers) chartInstances.bottomPerformers.resize();
          renderBranchRankingOption3(resData, slide);
        }

        // Update fiscal year text indicator
        const trendFiscalYearLabel = document.getElementById('trendFiscalYearLabel');
        if (trendFiscalYearLabel) {
          const yearSelect = document.getElementById('filterFiscalYear');
          trendFiscalYearLabel.innerText = yearSelect.options[yearSelect.selectedIndex]?.text || state.filters.fiscalYear;
        }
      } catch (err) {
        console.error("Failed to fetch active slide metrics:", err);
      }
    }

    // Populate Filter Modal Dropdowns on Page Load  
    async function loadFilterDropdowns() {
      try {
        const res = await fetch('/api/dashboard/filter-options');
        const options = await res.json();

        const yearSelect = document.getElementById('filterFiscalYear');
        yearSelect.innerHTML = options.fiscalYears.map(y => `<option value="${y.id}">${t_db(y.name)}</option>`).join('');
        if (state.filters.fiscalYear) {
          yearSelect.value = state.filters.fiscalYear;
        }

        const branchSelect = document.getElementById('filterParent');
        branchSelect.innerHTML = `<option value="ALL">${t_ui('All Branches')}</option>` +
          options.branches.map(b => `<option value="${b.id}">${t_db(b.name)}</option>`).join('');
        if (state.filters.parent) {
          branchSelect.value = state.filters.parent;
        }

        const taxSelect = document.getElementById('filterPlanItem');
        taxSelect.innerHTML = `<option value="ALL">${t_ui('All Tax Types')}</option>` +
          options.taxTypes.map(t => `<option value="${t.id}">${t_db(t.name)}</option>`).join('');

      }

    // 3. Slide 2: Branch Achievement % Horizontal Bar Chart
    function renderBranchVolumeChart(branchRes, slideConfig) {
      if (!chartInstances.branchVolume) {
        chartInstances.branchVolume = echarts.init(document.getElementById('chartBranchVolume'), 'dark');

      let scores = branchRes && branchRes.scores ? [...branchRes.scores] : [];

      // so the best performer appears at the top of the chart.
      const paired = branches.map((b, i) => ({ branch: b, score: scores[i] }));

      branches = paired.map(p => p.branch);
      scores = paired.map(p => p.score);

    // --- SLIDESHOW CAROUSEL ROTATOR LOGIC ---
    function goToSlide(index) {
      if (index < 0 || index >= state.slideCount) return;
      state.currentSlide = index;

      // Update slide visibility
      state.activeSlides.forEach((slideConfig, idx) => {
        const slide = document.getElementById(slideConfig.id);
        const dot = document.getElementById(`dot-${idx}`);

        if (idx === index) {
          slide?.classList.remove('slide-hidden');
          slide?.classList.add('slide-visible');
          if (dot) {
            dot.classList.remove('bg-slate-600', 'w-2');
            dot.classList.add('bg-blue-500', 'w-6');
          }
        } else {
          slide?.classList.remove('slide-visible');
          slide?.classList.add('slide-hidden');
          if (dot) {
            dot.classList.remove('bg-blue-500', 'w-6');
            dot.classList.add('bg-slate-600', 'w-2');
          }
        }
      });

      // Update Footer Title if element exists
      updateFooterTitle(index);

      // Update slide duration based on custom setting or default interval
      if (state.activeSlides[index]) {
        const slideConfig = state.activeSlides[index];
        state.slideDuration = slideConfig.durationMs || state.carouselDefaultDuration || 12000;
      }

      // Reset progress timer
      state.timerProgress = 0;

      // CRITICAL: Refresh dynamic active metric while slide is visible to trigger entry animation
      requestAnimationFrame(async () => {
        await refreshActiveSlideMetric(index);
      });
    }

    function nextSlide() {
      if (state.slideCount === 0) return;
      const nextIndex = (state.currentSlide + 1) % state.slideCount;
      goToSlide(nextIndex);
    }

    function prevSlide() {
      if (state.slideCount === 0) return;
      const prevIndex = (state.currentSlide - 1 + state.slideCount) % state.slideCount;
      goToSlide(prevIndex);
    }

    function toggleCarousel() {
      state.autoRotate = !state.autoRotate;
      updatePlayPauseButtonState();
    }

    function updatePlayPauseButtonState() {
      const icon = document.getElementById('playPauseIcon');
      const text = document.getElementById('playPauseText');
      if (state.autoRotate) {
        if (icon) icon.className = 'fa-solid fa-pause';
        if (text) text.innerText = t_ui('Pause');
      } else {
        if (icon) icon.className = 'fa-solid fa-play';
        if (text) text.innerText = t_ui('Resume');
      }
    }

    function updateFooterTitle(index) {
      const slideTitleDisplay = document.getElementById('slideTitleDisplay');
      if (slideTitleDisplay && state.activeSlides[index]) {
        const currentSlideConfig = state.activeSlides[index];
        const dispTitle = state.currentLang === 'am' && currentSlideConfig.titleAm ? currentSlideConfig.titleAm : currentSlideConfig.title;
        slideTitleDisplay.innerText = `${t_ui('Slide')} ${index + 1} ${t_ui('of')} ${state.slideCount}: ${dispTitle}`;
      }
    }

    function startTimerLoop() {
      setInterval(() => {
        if (!state.autoRotate || state.slideCount === 0) return;

        state.timerProgress += (100 / (state.slideDuration / 100));
        if (state.timerProgress >= 100) {
          state.timerProgress = 0;
          nextSlide();
        }

        const progressBar = document.getElementById('carouselProgressBar');
        if (progressBar) {
          progressBar.style.width = `${state.timerProgress}%`;
        }
      }, 100);
    }

    // Toggle Modal
    function toggleFilterModal() {
      const modal = document.getElementById('filterModal');
      const isOpening = modal.classList.contains('hidden');

      modal.classList.toggle('hidden');

      // If modal is opened, pause carousel by default
      if (isOpening) {
        state.autoRotate = false;
        updatePlayPauseButtonState();
      }
    }

    // Toggle Fullscreen Mode
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => console.log(e));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Initialize Everything on Load
    document.addEventListener("DOMContentLoaded", async () => {
      // Apply initial default theme
      changeTheme(state.currentTheme);

      try {
        await initializeDashboardConfig(); // 1. Load Server Config & Layout
      } catch (err) {
        console.error("Config load error:", err);
      }

      // 2. Start progress timer loop IMMEDIATELY so UI progress bar runs without delay
      startTimerLoop();

      // 3. Immediately render slide 0 and load cards + filter options in parallel
      goToSlide(0);
      loadTopCards().catch(err => console.error("Top cards error:", err));
      loadFilterDropdowns().catch(err => console.error("Filter options error:", err));

      // Window resize event handler
      window.addEventListener('resize', () => {
        Object.values(chartInstances).forEach(chart => chart && chart.resize());
      });

      // Setup ResizeObserver for automatic canvas scaling
      const observer = new ResizeObserver(() => {
        Object.values(chartInstances).forEach(chart => chart && chart.resize());
      });
      document.querySelectorAll('.slide-container').forEach(el => observer.observe(el));
    });
  </script>
</body>

</html>
