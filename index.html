<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BI Dashboard Slideshow</title>
  <!-- Bootstrap 5 CSS -->
  <link href="./bootstrap.min.css" rel="stylesheet">
  <style>
    /* Full-screen setup */
    html, body, .slideshow-container {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }
    
    /* Absolute positioning layers the slides directly on top of each other */
    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 1.5s ease-in-out; /* Smooth fade effect */
      pointer-events: none; /* Prevents hidden iframes from blocking clicks */
    }

    /* Active slide is visible and interactable */
    .slide-item.active {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Modern Bottom-Left Toolbar Styling */
    .slideshow-footer {
      position: absolute;
      visibility: hidden;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background: #b1b1b1;
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .footer-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 5px 15px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .footer-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #0d6efd; /* Bootstrap Primary Blue highlight */
    }

    .slide-indicator {
      color: rgba(255, 255, 255, 0.75);
      font-family: sans-serif;
      font-size: 0.9rem;
      user-select: none;
    }
  </style>
</head>
<body>
 
  <div class="slideshow-container">

    <!-- Slide 3 -->
    <div class="slide-item active">
      <iframe src="http://10.100.102.100:81/" allowfullscreen></iframe>
    </div>
    <!-- Slide 2 -->
  <div class="slide-item">
    <iframe
        src="http://10.100.102.100:86/debit.html"
        id="dashboard-frame"
        allowfullscreen>
    </iframe>
</div>

    <!-- Slide 1 -->
    <div class="slide-item">
      <iframe src="http://10.100.102.110:55396/bi/site/site1/slideshow/f4542758-0f8e-4e3b-a3f6-8e78a13eda27/db1" allowfullscreen></iframe>
    </div>

    <!-- Bottom Left Navigation Footer Bar -->
    <div class="slideshow-footer">
      <button class="footer-btn" onclick="changeSlide(-1)">❮</button>
      <span class="slide-indicator" id="slideNum"></span>
      <button class="footer-btn" onclick="changeSlide(1)">❯</button>
    </div>
  </div>

  <script>
    // Grab all elements with the class 'slide-item'
    const slides = document.querySelectorAll('.slide-item');
    const slideNumIndicator = document.getElementById('slideNum');
    let currentSlideIndex = 0;

    // Slide rotation interval (3 minutes)
    const rotationInterval = 3 * 60 * 1000; 

    function updateCounter() {
      // Updates the text inside the footer toolbar dynamically (e.g., "Slide 2 / 3")
      slideNumIndicator.textContent = `Slide ${currentSlideIndex + 1} / ${slides.length}`;
    }

    function showSlide(index) {
      // Remove the active class from the old slide
      slides[currentSlideIndex].classList.remove('active');
      
      // Calculate the new index safely loop back around
      currentSlideIndex = (index + slides.length) % slides.length;
      
      // Add the active class to the new slide
      slides[currentSlideIndex].classList.add('active');
      
      // Update our footer label counter text
      updateCounter();
    }

    function changeSlide(direction) {
      // Reset the auto-timer completely whenever someone manually overrides via the buttons
      clearInterval(slideTimer);
      showSlide(currentSlideIndex + direction);
      slideTimer = setInterval(autoAdvance, rotationInterval);
    }

    function autoAdvance() {
      showSlide(currentSlideIndex + 1);
    }

    // Start the slideshow master timer
    let slideTimer = setInterval(autoAdvance, rotationInterval);
    
    // Run the initial counter setup on page load
    updateCounter();

    // ==========================================
    // AUTO PAGE REFRESH (Every 30 Minutes)
    // ==========================================
    const reloadInterval = 15 * 60 * 1000; // 15 minutes in milliseconds
    setTimeout(() => {
      window.location.reload();
    }, reloadInterval);
  </script>
</body>
</html>
